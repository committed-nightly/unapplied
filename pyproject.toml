[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unapplied"
version = "0.1.0"
description = "Find the .gitattributes rules git never applied: patterns that match nothing, assignments a later line overrides, drivers that do not exist, and files committed before the rule arrived."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["git", "gitattributes", "crlf", "renormalize", "git-lfs", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
unapplied = "unapplied.cli:main"

[project.urls]
Source = "https://github.com/committed-nightly/unapplied"

[tool.hatch.build.targets.wheel]
packages = ["src/unapplied"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
